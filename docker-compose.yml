services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finflow}
      POSTGRES_DB: ${POSTGRES_DB:-finflow}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [auth-service, payment-service, fraud-service, analytics-service, ai-assistant-service]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    ports: ["8001:8000"]
    depends_on: [postgres, redis]

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    env_file: .env
    ports: ["8002:8000"]
    depends_on: [postgres, kafka, redis]

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-service/Dockerfile
    env_file: .env
    ports: ["8003:8000"]
    depends_on: [postgres, kafka, redis]

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    env_file: .env
    ports: ["8004:8000"]
    depends_on: [postgres, redis]

  ai-assistant-service:
    build:
      context: .
      dockerfile: services/ai-assistant-service/Dockerfile
    env_file: .env
    ports: ["8005:8000"]
    depends_on: [postgres, redis]

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription-service/Dockerfile
    env_file: .env
    ports: ["8006:8000"]
    depends_on: [postgres, kafka]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: .env
    ports: ["8007:8000"]
    depends_on: [postgres, redis, kafka]

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    env_file: .env
    ports: ["8008:8000"]
    depends_on: [postgres, kafka]

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file: .env
    depends_on: [redis, postgres, kafka]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-gateway, frontend]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:

